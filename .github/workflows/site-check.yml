name: FIELD KIT release checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runtime JavaScript and download regressions
        run: |
          node --check worker/router.mjs
          node qa/scripts/release-check.cjs
          node qa/scripts/download-integrity-check.cjs
      - name: Parse released PowerShell without execution
        shell: pwsh
        run: |
          $parseErrors = foreach ($source in Get-ChildItem -LiteralPath dist -Recurse -File -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($source.FullName, [ref]$tokens, [ref]$errors)
            $errors | ForEach-Object { "$($source.FullName):$($_.Extent.StartLineNumber): $($_.Message)" }
          }
          if ($parseErrors) { throw ($parseErrors -join [Environment]::NewLine) }
