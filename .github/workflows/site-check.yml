name: FIELD KIT release checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runtime JavaScript and download regressions
        run: |
          node --check worker/router.mjs
          node qa/scripts/release-check.cjs
          node qa/scripts/download-integrity-check.cjs
      - name: Parse PowerShell scripts and CLI wrappers without execution
        shell: pwsh
        run: ./qa/scripts/check-powershell-syntax.ps1
